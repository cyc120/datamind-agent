<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New API · 模型接入</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">NEW API / MODEL GATEWAY</div><h1>模型接入</h1><p>管理上游渠道、应用令牌，并验证模型调用。</p></div>
      <button id="logout" class="ghost" hidden>退出登录</button>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>

    <section id="setup-panel" class="card narrow" hidden>
      <h2>初始化管理员</h2>
      <form id="setup-form" class="stack">
        <label>用户名<input name="username" required maxlength="12" autocomplete="username"></label>
        <label>密码<input name="password" type="password" required autocomplete="new-password"></label>
        <label>确认密码<input name="confirmPassword" type="password" required autocomplete="new-password"></label>
        <button>初始化</button>
      </form>
    </section>

    <section id="login-panel" class="card narrow" hidden>
      <h2>管理员登录</h2>
      <form id="login-form" class="stack">
        <label>用户名<input name="username" required autocomplete="username"></label>
        <label>密码<input name="password" type="password" required autocomplete="current-password"></label>
        <button>登录</button>
      </form>
      <form id="twofa-form" class="stack" hidden>
        <label>两步验证码<input name="code" required inputmode="numeric" autocomplete="one-time-code"></label>
        <button>验证并登录</button>
      </form>
    </section>

    <div id="workspace" hidden>
      <nav class="tabs" aria-label="功能">
        <button data-tab="channels" class="selected">渠道</button>
        <button data-tab="tokens">应用令牌</button>
        <button data-tab="test">调用测试</button>
      </nav>

      <section id="channels" class="tab">
        <div class="summary" aria-label="渠道概况">
          <div class="summary-card"><span>渠道</span><strong id="channel-count">0</strong></div>
          <div class="summary-card"><span>已启用</span><strong id="enabled-count">0</strong></div>
          <div class="summary-card"><span>模型</span><strong id="model-count">0</strong></div>
        </div>
        <div class="section-head"><div><h2>渠道列表</h2><p>查看接入状态，测试连通性，管理上游模型。</p></div><div class="section-actions"><button id="refresh-channels" class="ghost">刷新</button><button id="add-channel">＋ 添加渠道</button></div></div>
        <div class="toolbar"><label class="search"><span>⌕</span><input id="channel-search" type="search" placeholder="搜索渠道或模型"></label><div class="filters" role="group" aria-label="筛选渠道"><button data-filter="all" class="selected">全部</button><button data-filter="enabled">已启用</button><button data-filter="disabled">已停用</button></div></div>
        <div id="channel-list" class="grid"></div>
        <dialog id="channel-dialog" class="dialog">
          <div class="dialog-head"><div><div class="eyebrow">渠道配置</div><h2 id="channel-form-title">添加渠道</h2><p>保存后可测试上游连接。</p></div><button id="close-channel" class="icon-button" type="button" aria-label="关闭">×</button></div>
          <form id="channel-form" class="form-grid">
            <input name="id" type="hidden">
            <label>供应商<select name="type" required>
              <option value="43">DeepSeek</option><option value="17">通义千问</option><option value="25">Kimi</option><option value="16">智谱 AI</option><option value="45">火山方舟</option><option value="46">百度千帆</option><option value="23">腾讯混元</option><option value="18">讯飞星火</option><option value="35">MiniMax</option><option value="40">硅基流动</option><option value="1">OpenAI 兼容</option>
            </select><small>选择上游服务商</small></label>
            <label>渠道名称<input name="name" required placeholder="例如 DeepSeek 主渠道"><small>便于在列表中识别</small></label>
            <fieldset class="wide model-fieldset"><legend>可用模型</legend>
              <div class="model-picker">
                <div class="model-picker-toolbar">
                  <input id="model-search" type="search" placeholder="搜索模型 ID">
                  <div class="model-picker-actions"><span id="model-option-count">请先获取模型列表</span><button id="select-visible-models" class="ghost" type="button">全选当前结果</button><button id="clear-selected-models" class="ghost" type="button">清空已选</button></div>
                </div>
                <div id="model-options" class="model-options" role="group" aria-label="可用模型"></div>
              </div>
              <div class="selected-model-heading">已选模型 <span id="selected-model-count">0</span></div>
              <div id="selected-models" class="selected-models" aria-live="polite"></div>
              <div class="model-row model-manual-row"><input id="manual-model-input" placeholder="手动输入模型 ID，可用逗号分隔"><button id="add-manual-model" class="ghost" type="button">添加</button><button id="fetch-models" class="ghost" type="button">获取模型</button></div>
              <input id="channel-models" name="models" type="hidden">
              <output id="model-fetch-status" class="model-fetch-status" role="status" aria-live="polite" hidden></output>
              <small>可搜索并勾选多个模型；保存后供应用令牌调用。</small>
            </fieldset>
            <label class="wide">API 地址<input name="base_url" type="url" placeholder="留空使用供应商默认地址"><small>自定义兼容服务时填写完整地址</small></label>
            <label class="wide">API Key<input name="key" type="password" autocomplete="new-password" placeholder="粘贴供应商提供的密钥"><small id="key-help">密钥仅用于连接上游，不会显示在渠道列表中</small></label>
            <div class="dialog-footer wide"><button id="save-channel">保存渠道</button><button id="cancel-edit" class="ghost" type="button">取消</button></div>
          </form>
        </dialog>
      </section>

      <section id="tokens" class="tab" hidden>
        <div class="section-head"><div><h2>应用令牌</h2><p>赛题程序使用令牌调用 /v1 接口。复制时读取完整密钥，页面不持久保存。</p></div><button id="refresh-tokens" class="ghost">刷新</button></div>
        <div id="token-list" class="grid"></div>
        <div class="card form-card">
          <h3>创建令牌</h3>
          <form id="token-form" class="form-grid">
            <label>名称<input name="name" required maxlength="50" placeholder="例如 赛题项目"></label>
            <div class="actions"><button>创建</button></div>
          </form>
        </div>
      </section>

      <section id="test" class="tab" hidden>
        <div class="section-head"><div><h2>调用测试</h2><p>用应用令牌实际请求模型接口。</p></div></div>
        <div class="card form-card">
          <form id="test-form" class="form-grid">
            <label class="wide">应用令牌<input name="api_key" type="password" required autocomplete="off" placeholder="sk-…"></label>
            <label>模型 ID<input name="model" required placeholder="例如 deepseek-flash"></label>
            <label class="wide">测试内容<textarea name="prompt" rows="3" required>请用一句话介绍你自己。</textarea></label>
            <div class="actions wide"><button>发送测试请求</button><button type="button" id="list-models" class="ghost">查看可用模型</button></div>
          </form>
          <pre id="test-result" aria-live="polite"></pre>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
