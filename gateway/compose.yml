name: new-api

services:
  new-api:
    build:
      context: ./source
      dockerfile: Dockerfile.core
    image: new-api-model-core:local
    container_name: new-api-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?Set NEW_API_SESSION_SECRET in .env}
      TRUSTED_PROXIES: none
      TASK_PLUGIN_ENABLED: "false"
    volumes:
      - new_api_data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  new_api_data:
    name: datamind-new-api-data
    external: true
