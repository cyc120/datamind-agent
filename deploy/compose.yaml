name: datamind-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: datamind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamind_dev}
      # 元数据底座库（Catalog / Document / Eval / Trace）
      POSTGRES_DB: ${META_DB:-datamind_meta}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环地址 127.0.0.1：默认拒绝局域网/公网访问（审计 F03）。
      # 改动需下次 `docker compose up -d` 重建容器后生效；本次未重建运行中的栈。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_meta_data:/var/lib/postgresql/data
      # 首次启动自动执行：角色 → 元数据 DDL → 演示库 DDL
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${META_DB:-datamind_meta}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: datamind-qdrant
    restart: unless-stopped
    ports:
      # 仅绑定回环地址 127.0.0.1（审计 F03），同样于下次 `up` 时生效。
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # REST
      - "127.0.0.1:6334:6334"                   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储说明：
  # MinIO 官方镜像已于 2025 年从 Docker Hub / quay.io 下架（需企业订阅授权），
  # 按技术说明书 §8.2 允许的替代项，Demo 阶段使用本地文件卷 data/object_store/。
  # 如需 S3 兼容存储，可恢复以下配置或自建 S3 后修改 ingestion/storage 配置。
  #
  # minio:
  #   image: minio/minio:latest   # 需自备可用镜像源
  #   ...

# ------------------------------------------------------------
# 已知安全边界（审计 F03，本次仅收敛端口暴露面，未改动认证方案：
# 认证方案会破坏本机正在运行的栈，故只记录、不在本次修改）
#   1. Qdrant 无认证：容器未配置 api-key，任何能连到 6333/6334 的进程都可读写。
#      现已通过 127.0.0.1 绑定限制为仅本机可达。
#   2. deploy/init/01_roles.sql 中存在明文开发口令
#      （datamind_app_dev / readonly_dev）；本文件 POSTGRES_PASSWORD 默认值
#      datamind_dev 同为明文。生产部署应改为从 secret/环境变量注入。
#   3. 若未来需要跨机访问，请显式配置防火墙或反向代理 + 认证，
#      不要直接删除 127.0.0.1 前缀。
# ------------------------------------------------------------

volumes:
  pg_meta_data:
  qdrant_data:
